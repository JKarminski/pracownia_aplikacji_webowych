<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taki oto pliczek</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <h1>Strona kontaktowa</h1>
        <p>To jest strona do kontaktu!</p>
    </header>
    
    <nav>
        <a href="/">Strona glowna</a>
        <a href="/kontakt">Kontakt</a>
    </nav>


    <form action="/kontakt" method="GET">
        <div id="name" class="formsy">
            <label for="input_name">Wpisz swoje imie: </label><input type="text" id="input_name" name="name" class="inputsy">
        </div>
        <div id="email" class="formsy">
            <label for="input_email">Wpisz swoje nazwisko: </label><input type="text" id="input_email" name="email" class="inputsy">
        </div>
        <div id="message" class="formsy">
            <label for="input_message">Wpisz wiadomosc: </label>
            <textarea id="input_message" name="message" class="inputsy"></textarea>
        </div>
        <input type="submit" value="Wyslij" id="submiter">
    </form>
    <footer>Strone wykonal: Johnny 2026</footer>
</body>

</html>
